<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<title>写给你的信 · 语音</title>

<!-- ===========================================================
     使用前只需要改下面 CONFIG 里的 5 行，音频文件放到同一目录。
     改好后把整个文件夹（player.html + 音频文件）一起上传到托管处。
     贴纸里写的网址，就是 player.html 的网址。
     =========================================================== -->
<script>
const CONFIG = {
  audio : "voice.m4a",              // 录音文件名，必须和 html 放在同一个文件夹
  title : "写给你的信",              // 页面大标题
  date  : "2026-10-03",             // 写信日期，留空则不显示
  note  : "点一下下面的按钮，就能听到我录给你的话。",
  letter: ""                        // 想额外显示的文字（可留空，不写就整块隐藏）
};
</script>

<style>
  :root{
    --paper:#f6f2ea;
    --ink:#2c2a26;
    --ink-soft:#6f6a61;
    --line:#ded6c8;
    --accent:#8a6a3f;
    --accent-soft:#c8b291;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 80% at 50% 0%, #fdfbf7 0%, var(--paper) 55%, #efe9df 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",
                "Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:520px;
    background:#fffdf9;
    border:1px solid var(--line);
    border-radius:20px;
    padding:34px 26px 30px;
    box-shadow:0 18px 40px -24px rgba(60,48,30,.38), 0 2px 6px rgba(60,48,30,.05);
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--accent-soft);
    margin:0 0 14px;
  }
  h1{
    font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
    font-size:30px;
    line-height:1.28;
    font-weight:600;
    letter-spacing:.02em;
    margin:0 0 8px;
  }
  .date{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.14em;
    margin:0 0 26px;
  }

  .rule{
    height:1px;
    background:linear-gradient(90deg,var(--accent-soft),transparent 85%);
    margin:0 0 26px;
  }

  .player{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 18px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fbf8f2;
  }

  .play{
    flex:0 0 auto;
    width:64px;height:64px;
    border:none;border-radius:50%;
    background:linear-gradient(160deg,#9c7a4c,#7d5f38);
    color:#fff;
    display:grid;place-items:center;
    cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(122,92,54,.9);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .play:active{transform:scale(.94)}
  .play:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .play svg{width:26px;height:26px;fill:currentColor;display:block}
  .play .icon-pause{display:none}
  .player.playing .icon-play{display:none}
  .player.playing .icon-pause{display:block}

  .meter{flex:1 1 auto;min-width:0}
  .bar{
    position:relative;
    height:6px;
    border-radius:99px;
    background:#e6dfd2;
    cursor:pointer;
  }
  .bar:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .fill{
    position:absolute;inset:0 auto 0 0;
    width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,#b8975f,#8a6a3f);
  }
  .knob{
    position:absolute;top:50%;left:0;
    width:14px;height:14px;margin:-7px 0 0 -7px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--accent);
    box-shadow:0 1px 4px rgba(80,60,30,.3);
    pointer-events:none;
  }
  .times{
    display:flex;justify-content:space-between;
    font-size:12px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    margin-top:9px;
    letter-spacing:.04em;
  }

  .note{
    margin:22px 0 0;
    font-size:14px;
    line-height:1.7;
    color:var(--ink-soft);
  }

  .letter{
    margin-top:22px;
    padding-top:22px;
    border-top:1px dashed var(--line);
    font-size:15px;
    line-height:1.9;
    white-space:pre-wrap;
    font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  }

  .fallback{
    margin-top:18px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .fallback a{color:var(--accent)}
  .fallback p{margin:0 0 6px}
  .fallback.err{color:#9c3b1f}
  .fallback.err a{color:#9c3b1f}

  @media (max-width:400px){
    .card{padding:28px 18px 24px;border-radius:16px}
    h1{font-size:26px}
    .play{width:58px;height:58px}
  }
  @media (prefers-reduced-motion:reduce){
    .play{transition:none}
  }
</style>
</head>
<body>

<main class="card">
  <p class="eyebrow">Voice Letter</p>
  <h1 id="title">写给你的信</h1>
  <p class="date" id="date"></p>
  <div class="rule"></div>

  <div class="player" id="player">
    <button class="play" id="playBtn" aria-label="播放录音">
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l11.2-6.86a1.05 1.05 0 0 0 0-1.8L9.56 4.24A1.05 1.05 0 0 0 8 5.14Z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></svg>
    </button>

    <div class="meter">
      <div class="bar" id="bar" role="slider" tabindex="0"
           aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="times">
        <span id="cur">0:00</span>
        <span id="dur">--:--</span>
      </div>
    </div>
  </div>

  <p class="note" id="note"></p>

  <div class="letter" id="letter" hidden></div>

  <div class="fallback" id="fallback" hidden>
    <p>播放器没能加载音频，可以直接点这里：<a id="dl" href="#" download>下载 / 播放录音</a></p>
  </div>

  <audio id="audio" preload="metadata" playsinline></audio>
</main>

<script>
(function () {
  // 允许用 ?a=xxx.mp3 临时指定音频，方便一个页面挂多段录音
  var qs = new URLSearchParams(location.search);
  var src = qs.get("a") || CONFIG.audio;

  var audio    = document.getElementById("audio");
  var player   = document.getElementById("player");
  var playBtn  = document.getElementById("playBtn");
  var bar      = document.getElementById("bar");
  var fill     = document.getElementById("fill");
  var knob     = document.getElementById("knob");
  var cur      = document.getElementById("cur");
  var dur      = document.getElementById("dur");
  var fallback = document.getElementById("fallback");
  var dl       = document.getElementById("dl");

  document.getElementById("title").textContent = CONFIG.title || "";
  document.title = (CONFIG.title || "VOICE") + " · 语音";

  var dateEl = document.getElementById("date");
  if (CONFIG.date) { dateEl.textContent = CONFIG.date; } else { dateEl.remove(); }

  var noteEl = document.getElementById("note");
  if (CONFIG.note) { noteEl.textContent = CONFIG.note; } else { noteEl.remove(); }

  var letterEl = document.getElementById("letter");
  if (CONFIG.letter) { letterEl.textContent = CONFIG.letter; letterEl.hidden = false; }

  audio.src = src;
  dl.href = src;
  dl.setAttribute("download", src.split("/").pop());

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) { return "--:--"; }
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function paint() {
    var d = audio.duration;
    var pct = (isFinite(d) && d > 0) ? (audio.currentTime / d) * 100 : 0;
    fill.style.width = pct + "%";
    knob.style.left  = pct + "%";
    bar.setAttribute("aria-valuenow", Math.round(pct));
    cur.textContent  = fmt(audio.currentTime);
    if (isFinite(d) && d > 0) { dur.textContent = fmt(d); }
  }

  function toggle() {
    if (audio.paused) {
      var p = audio.play();
      if (p && p.catch) { p.catch(function () { showFallback(); }); }
    } else {
      audio.pause();
    }
  }

  function showFallback() {
    fallback.hidden = false;
    fallback.classList.add("err");
  }

  playBtn.addEventListener("click", toggle);

  audio.addEventListener("play",  function () { player.classList.add("playing");    playBtn.setAttribute("aria-label", "暂停"); });
  audio.addEventListener("pause", function () { player.classList.remove("playing"); playBtn.setAttribute("aria-label", "播放录音"); });
  audio.addEventListener("ended", function () { player.classList.remove("playing"); audio.currentTime = 0; paint(); });
  audio.addEventListener("timeupdate", paint);
  audio.addEventListener("loadedmetadata", paint);
  audio.addEventListener("durationchange", paint);
  audio.addEventListener("error", showFallback);

  function seekTo(clientX) {
    var r = bar.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    if (isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = ratio * audio.duration;
      paint();
    }
  }
  bar.addEventListener("click", function (e) { seekTo(e.clientX); });
  bar.addEventListener("keydown", function (e) {
    if (!isFinite(audio.duration)) { return; }
    if (e.key === "ArrowRight") { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); paint(); e.preventDefault(); }
    if (e.key === "ArrowLeft")  { audio.currentTime = Math.max(0, audio.currentTime - 5); paint(); e.preventDefault(); }
    if (e.key === " " || e.key === "Enter") { toggle(); e.preventDefault(); }
  });

  paint();
})();
</script>
</body>
</html>
